<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1><span>[</span>
            <p>Методы массивов</p>
            <span>]</span>
        </h1>
    </header>
    <section>
        <p>Исходный массив</p>
        <div class="container" id="original">
        </div>
    </section>
    <section>
        <div class="command" onclick="makeMap()">.map()</div>
        <div class="command" onclick="makeFilter()">.filter()</div>
        <div class="command" onclick="makeReduce()">.reduce()</div>
        <div class="command">.slice()</div>
        <div class="command">.reverse()</div>
        <div class="command">.sort()</div>
    </section>
    <section>
        <p>Результат</p>
        <div class="container" id="result">
        </div>
        <!-- Цветные блоки будут добавлены здесь с помощью JavaScript -->
        </div>
    </section>

    <script src="app.js"></script>

</body>

</html>
